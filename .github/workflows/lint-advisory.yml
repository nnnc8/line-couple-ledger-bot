name: lint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: pnpm lint (baseline delta)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and reject new baseline findings
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base_dir="$RUNNER_TEMP/lint-base"
          base_json="$RUNNER_TEMP/lint-base.json"
          head_json="$RUNNER_TEMP/lint-head.json"
          mkdir -p "$base_dir"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git archive "$BASE_SHA" | tar -x -C "$base_dir"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$base_dir/node_modules"

          if pnpm exec eslint . --format json --output-file "$head_json"; then
            :
          else
            eslint_exit_code=$?
            if [ "$eslint_exit_code" -ne 1 ]; then exit "$eslint_exit_code"; fi
          fi

          if (cd "$base_dir" && ./node_modules/.bin/eslint . --format json --output-file "$base_json"); then
            :
          else
            eslint_exit_code=$?
            if [ "$eslint_exit_code" -ne 1 ]; then exit "$eslint_exit_code"; fi
          fi

          node .github/scripts/check-lint-baseline.mjs "$base_json" "$head_json" "$base_dir" "$GITHUB_WORKSPACE"
