name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: typecheck, test, PostgreSQL, e2e, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          # A per-run value keeps the disposable CI database credential out of
          # source control while still allowing the isolated test wrapper to
          # connect to this service container.
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: V3-0 critical PostgreSQL gates (no skips)
        run: |
          pnpm test:v3:pg
          pnpm exec tsx scripts/test-v3-0-release-pg.ts test:precutover
          pnpm exec tsx scripts/test-v3-0-release-pg.ts test:incident
        env:
          # An isolated service container; every suite owns a disposable database.
          V3_PG_ADMIN_URL: postgresql://postgres:${{ github.run_id }}@localhost:5432/postgres

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: E2E tests
        run: pnpm test:e2e
        env:
          P1B_MEASURE_STAGE: after

      - name: Preserve P1-B mobile and replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-b-browser-evidence
          path: |
            output/playwright/p1-b/
            output/playwright/results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Build
        run: pnpm build
        env:
          # Build only needs a stub env. Real secrets are not used in CI.
          DATABASE_URL: postgresql://stub:stub@localhost:5432/stub
          LINE_CHANNEL_SECRET: ci_stub
          LINE_CHANNEL_ACCESS_TOKEN: ci_stub
          GEMINI_API_KEY: ci_stub
          SUPABASE_URL: https://ci.stub
          SUPABASE_SECRET_KEY: ci_stub
          COUPLE_SETUP_CODE: ci_stub_couple_setup_code_20
          LINE_LOGIN_CHANNEL_ID: "200000000"
          NEXT_PUBLIC_LIFF_ID: ci-stub
          LIFF_SESSION_SECRET: ci_stub_liff_session_secret_32_chars
          APP_URL: https://ci.stub
          CRON_SECRET: ci_stub_cron_secret
