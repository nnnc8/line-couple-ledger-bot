name: Documentation
description: Report a gap, typo, or unclear section in the README or docs/.
labels: ["docs"]
body:
  - type: input
    id: location
    attributes:
      label: File or section
      placeholder: "docs/env-vars.md — COUPLE_SETUP_CODE row"
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What's wrong / missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording (optional)
