name: Bug report
description: Report something broken in the bot, dashboard, or DB layer.
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: One-paragraph description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit / version
      placeholder: output of `git rev-parse HEAD`
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options:
        - Local dev (pnpm dev)
        - Vercel preview deploy
        - Vercel production
        - I haven't deployed yet
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
  - type: checkboxes
    id: checks
    attributes:
      label: Self-checks
      options:
        - label: I searched existing issues and didn't find a duplicate
        - label: I confirmed this is not a secrets-leak issue (see SECURITY.md)
